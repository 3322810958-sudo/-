name: 自动化测试

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-core.txt
      - name: 安装测试依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-core.txt pytest
      - name: 运行测试
        run: python -m pytest tests -q --import-mode=importlib -p no:cacheprovider
      - name: 检查 Python 与前端语法
        run: |
          python -m compileall -q app launcher.py scripts
          node --check app/static/app.js
