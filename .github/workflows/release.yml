name: 构建并发布 Windows 更新包

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "发布标签，例如 v2.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: 安装构建依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: 运行测试
        run: python -m pytest tests -q --import-mode=importlib -p no:cacheprovider
      - name: 准备离线 OCR 模型
        run: python scripts/prefetch_ocr_models.py
      - name: 构建轻量无损补丁与校验文件
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $tag.TrimStart("v")
          & .\scripts\build_release.ps1 -Version $version -SkipTutorialPdf -PatchOnly
          if ($LASTEXITCODE -ne 0) { throw "Windows 发布包构建失败" }
      - name: 验证补丁可独立启动
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.version || github.ref_name }}"
          $version = $tag.TrimStart("v")
          $patch = Get-ChildItem -LiteralPath .\release -Filter "*V$version*WindowsUpdate*.zip" | Select-Object -First 1
          if (-not $patch) { throw "未找到待验证补丁" }
          $testRoot = Join-Path $env:RUNNER_TEMP "yxrt-patch-smoke"
          New-Item -ItemType Directory -Path $testRoot -Force | Out-Null
          Expand-Archive -LiteralPath $patch.FullName -DestinationPath $testRoot -Force
          $exe = Get-ChildItem -LiteralPath $testRoot -Filter "*.exe" -File | Select-Object -First 1
          if (-not $exe) { throw "补丁缺少主程序" }
          & .\scripts\smoke_test_frozen.ps1 -Executable $exe.FullName -ExpectedVersion $version -Port 8792
          if ($LASTEXITCODE -ne 0) { throw "补丁独立启动验证失败" }
      - name: 发布 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*.zip
            release/*.zip.sha256
